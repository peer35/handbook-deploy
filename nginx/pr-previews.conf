# PR previews: https://PREVIEW_HOST/<pr-number>/
# setup.sh substitutes PREVIEW_HOST. TLS is not configured here; add it the way your
# environment provides certificates.
server {
    listen 80;
    listen [::]:80;
    server_name PREVIEW_HOST;

    root /var/www/previews;
    index index.html;
    absolute_redirect off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # GitHub webhook -> pr_preview_hook.py
    location = /_hooks/github {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 25m;
    }

    # Build logs: plain text, never cached or compressed so the viewer can follow them
    location /_logs/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location ~ \.log$ {
            types { }
            default_type "text/plain; charset=utf-8";
            gzip off;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
    }

    # Staging directories (.12.new) and other dotfiles
    location ~ /\. {
        deny all;
    }

    location ~ ^/\d+$ {
        return 301 $uri/;
    }

    location ~ ^/(?<pr>\d+)/ {
        try_files $uri $uri/ $uri.html =404;
        error_page 404 /$pr/404.html;
    }

    location = / {
        default_type "text/plain; charset=utf-8";
        return 200 "Pull request previews live at /<pr-number>/\n";
    }

    location / {
        return 404;
    }
}
